name: Java REST API CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - '.github/workflows/java-rest-api-ci.yaml'
      - 'templates/java-rest-api/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '.github/workflows/java-rest-api-ci.yaml'
      - 'templates/java-rest-api/**'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  JAVA_VERSION: '17'

jobs:
  build-test:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

  docker-build-push:
    runs-on: self-hosted
    needs: build-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

