name: Java REST API CI/CD (Docker Multistage)

on:
  push:
    branches:
      - '**'
    paths:
      - ".github/workflows/java-rest-api-ci.yaml"
      - 'templates/java-rest-api/src/**'
      - 'templates/java-rest-api/pom.xml'
      - 'templates/java-rest-api/Dockerfile'
  pull_request:
    paths:
      - ".github/workflows/java-rest-api-ci.yaml"
      - 'templates/java-rest-api/src/**'
      - 'templates/java-rest-api/pom.xml'
      - 'templates/java-rest-api/Dockerfile'

jobs:
  build:
    name: Build, Test & Package Docker
    # runs-on: self-hosted
    runs-on: ubuntu-latest
    outputs:
      var-1: ${{ steps.vars.outputs.var-1 }}

    steps:
      # - name: Checkout repository
