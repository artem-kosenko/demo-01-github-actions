name: Java REST API CI/CD (Docker Multistage)

on:
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/java-rest-api-ci.yaml'
      - 'templates/java-rest-api/**'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/java-rest-api-ci.yaml'
      - 'templates/java-rest-api/**'

jobs:
  build:
    name: Build, Test & Package Docker
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-java-rest-api:latest templates/java-rest-api

