name: Java REST API CI/CD (Docker Multistage)

on:
  push:
    branches:
      - '**'
    paths:
      - ".github/workflows/java-rest-api-ci.yaml"
      - 'templates/java-rest-api/src/**'
      - 'templates/java-rest-api/pom.xml'
      - 'templates/java-rest-api/Dockerfile'
  pull_request:
    paths:
      - ".github/workflows/java-rest-api-ci.yaml"
      - 'templates/java-rest-api/src/**'
      - 'templates/java-rest-api/pom.xml'
      - 'templates/java-rest-api/Dockerfile'

jobs:
  build:
    name: Build, Test & Package Docker
    runs-on: self-hosted
    # runs-on: ubuntu-latest
    outputs:
      var-1: ${{ steps.vars.outputs.var-1 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # - name: Build Docker image
      #   run: docker build -t my-java-rest-api:latest templates/java-rest-api
      
      # 100% cause an issue "Skip output 'var-1' since it may contain secret. But works inside a job.
      - name: Set var-1 (with issue)
        id: vars
        run: |
          VAR_1="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c" 
          echo var-1=$VAR_1 >> $GITHUB_OUTPUT
      
      - name: Print var-1 (with issue)
        run:
          echo ${{ steps.vars.outputs.var-1 }}
      
      # no issue. works inside the job.
      - name: Set Env Vars based on pom.xml file (without issue)
        id: vars2
        uses: ./.github/actions/java-app-info
        with:
          pom-xml-path: templates/java-rest-api/pom.xml

      - name: Print Env Vars (without issue)
        run: | 
          echo APP_GROUP_ID=$APP_GROUP_ID
          echo APP_ARTIFACT_ID=$APP_ARTIFACT_ID
          echo APP_VERSION=$APP_VERSION
          echo APP_PACKAGING=$APP_PACKAGING
          echo APP_VAR1=$APP_VAR1
          echo APP_JAVA_VERSION=$APP_JAVA_VERSION


