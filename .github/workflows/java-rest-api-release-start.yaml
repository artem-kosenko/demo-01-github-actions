name: Start Java Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Select release type"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  start_release:
    runs-on: self-hosted
    env:
      PROJECT_DIR: templates/java-rest-api

    container:
      image: maven:3.9-eclipse-temurin-17

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git user
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Determine next version
        id: version
        run: |
          cd "$PROJECT_DIR"
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Current version: $CURRENT_VERSION"

          BASE_VERSION=${CURRENT_VERSION%-SNAPSHOT}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

          case "${{ github.event.inputs.release_type }}" in
            major)
              NEW_VERSION="$((MAJOR + 1)).0.0"
              ;;
            minor)
              NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
              ;;
            patch)
              NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
              ;;
          esac

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Create release branch
        run: |
          git fetch origin develop
          git checkout develop
          git pull origin develop
          RELEASE_BRANCH="release/${{ steps.version.outputs.new_version }}"
          git checkout -b "$RELEASE_BRANCH"
          echo "RELEASE_BRANCH=$RELEASE_BRANCH" >> $GITHUB_ENV

      - name: Update pom.xml version to release
        run: |
          cd "$PROJECT_DIR"
          mvn versions:set -DnewVersion=${{ steps.version.outputs.new_version }} -B -q
          mvn versions:commit -q
          cd ../..
          git add "$PROJECT_DIR/pom.xml"
          git commit -m "chore: prepare release ${{ steps.version.outputs.new_version }}"
          git push origin "$RELEASE_BRANCH"

      - name: Trigger STAGE deployment workflow
        uses: peter-evans/workflow-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          ref: ${{ env.RELEASE_BRANCH }}
          workflow: java-rest-api-deploy.yaml
          inputs:
            environment: "stage"
